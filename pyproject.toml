    "requests>=2.32,<3",
    "confluent-kafka>=2,<3",
    "pyspark==3.5.9",
    "boto3>=1.43.115",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]
