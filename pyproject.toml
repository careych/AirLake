requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32,<3",
    "confluent-kafka>=2,<3",
    "pyspark==3.5.9",
    "boto3>=1.43.115",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
